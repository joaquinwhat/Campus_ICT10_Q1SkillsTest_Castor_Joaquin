<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Receipt Generator</title>
<link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>

</head>

<body>


    <style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f9;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 50px;
    }
    h2 {
        color: #333;
    }
    div {
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        width: 300px;
    }
    button {
        margin-top: 15px;
        width: 100%;
        padding: 10px;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
    }
    button:hover {
        background-color: #45a049;
    }
    #receipt {
        margin-top: 15px;
        font-weight: bold;
        color: #333;
    }
</style>


    <h2>Receipt Generator</h2>
    
    <div>
        <input type="checkbox" id="Burger" value="150"> Burger (₱150)<br>
        <input type="checkbox" id="Fries" value="90"> Fries (₱90)<br>
        <input type="checkbox" id="Drink" value="60"> Drink (₱60)<br>
        <input type="checkbox" id="Dessert" value="30"> Dessert (₱30)<br>
    </div>

    <button py-click="calculate_total">Calculate</button>

    <div id="receipt"></div>

    <script type="py" src="./main.py"></script>
</body>
</html>
